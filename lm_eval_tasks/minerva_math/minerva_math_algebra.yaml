tag:
  - math_word_problems_local
task: minerva_math_algebra_local
dataset_path: EleutherAI/hendrycks_math
process_docs: !function utils.process_docs
dataset_name: algebra
output_type: generate_until
training_split: train
test_split: test
doc_to_text:  !function utils.doc_to_text
process_results: !function utils.process_results
doc_to_target: "{{answer if few_shot is undefined else solution}}"
generation_kwargs:
  until:
    - "Problem:"
  do_sample: false
  temperature: 0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: math_verify
    aggregation: mean
    higher_is_better: true
# NOTE: 0-shot (not 4), matching the official Fast-dLLM v2 eval harness's
# actual minerva_math invocation (eval_script.sh: --num_fewshot 0). The
# doc_to_text CoT+\boxed{} instruction (see utils.py) is what anchors the
# answer format now, not few-shot exemplars.
num_fewshot: 0
metadata:
  version: 2.0
fewshot_config:
  sampler: first_n
  samples: !function utils.list_fewshot_samples
